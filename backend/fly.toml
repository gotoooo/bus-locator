# Fly.io デプロイ設定（例）。Render/Railway を使う場合は不要。
#
# 手順:
#   cd backend
#   fly launch --no-deploy        # アプリ作成（このtomlを使う場合は既存設定を流用）
#   fly volume create geiyo_data --size 1   # お気に入りSQLiteの永続化
#   fly deploy
#
# RT集約ポーラを常駐させるため、auto_stop は無効（0へスケールさせない）。

app = "geiyo-bus"          # ← 自分のアプリ名に変更
primary_region = "nrt"     # 東京

[build]
  dockerfile = "Dockerfile"

[env]
  ENABLE_POLLER = "1"
  DB_PATH = "/data/favorites.db"

[[mounts]]
  source = "geiyo_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # ポーラを止めない
  auto_start_machines = true
  min_machines_running = 1     # 常に1台起動（ポーラ常駐）

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
