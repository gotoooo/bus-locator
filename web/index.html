<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>芸陽バス 接近情報</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#16324f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="芸陽バス">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>🚌 通勤バス</h1>
    <p class="sub">才の瀬 ⇄ 日下橋 の直近便</p>
  </header>

  <div class="toolbar">
    <button id="refresh">↻ 更新</button>
    <label><input type="checkbox" id="autorefresh" checked> 自動更新(15秒)</label>
    <span id="status" class="muted"></span>
  </div>
  <div id="commute" class="cards"></div>

  <!-- バックエンドAPIの接続先設定（Vercel配信時はここを別ホストのURLにする） -->
  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script>
    // Service Worker 登録（PWA。HTTPS か localhost で有効）
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((e) =>
          console.warn("SW登録失敗:", e));
      });
    }
  </script>
</body>
</html>
